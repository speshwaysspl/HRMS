<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" fill="none">
  <defs>
    <linearGradient id="cloud" x1="160" y1="20" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF2FB"/>
      <stop offset="1" stop-color="#E2E8F7"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="160" y1="110" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF1FB"/>
    </linearGradient>
    <linearGradient id="boxInside" x1="160" y1="96" x2="160" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B7BE8"/>
      <stop offset="1" stop-color="#90A7F2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9B9F2"/>
      <stop offset="1" stop-color="#7189E3"/>
    </linearGradient>
    <linearGradient id="plane" x1="250" y1="34" x2="290" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9DB4F6"/>
      <stop offset="1" stop-color="#5B7BE8"/>
    </linearGradient>
  </defs>

  <!-- background cloud -->
  <path d="M58 168c-24 0-38-16-36-35 2-18 18-29 36-27 2-26 22-44 48-42 10-24 34-40 62-38 30 2 52 24 56 52 22-6 44 8 48 30 22 2 34 18 32 36-2 16-16 26-34 26H58z" fill="#7C93DB" fill-opacity=".14"/>

  <!-- ground shadow -->
  <ellipse cx="160" cy="200" rx="92" ry="9" fill="#7C93DB" fill-opacity=".22"/>

  <!-- left leaves -->
  <g fill="url(#leaf)">
    <path d="M86 198c-10-14-12-32-2-44 8 12 10 30 2 44z"/>
    <path d="M94 198c-2-18 6-34 20-40 2 16-6 32-20 40z"/>
    <path d="M78 198c-14-8-22-20-20-32 12 4 20 16 20 32z" opacity=".8"/>
  </g>
  <!-- right leaves -->
  <g fill="url(#leaf)">
    <path d="M234 198c10-14 12-32 2-44-8 12-10 30-2 44z"/>
    <path d="M226 198c2-18-6-34-20-40-2 16 6 32 20 40z"/>
    <path d="M242 198c14-8 22-20 20-32-12 4-20 16-20 32z" opacity=".8"/>
  </g>

  <!-- box: open top -->
  <path d="M110 112l14-26h72l14 26z" fill="url(#boxInside)"/>
  <!-- box: front -->
  <rect x="104" y="110" width="112" height="86" rx="6" fill="url(#boxFront)" stroke="#D3DCF5" stroke-width="1.5"/>
  <!-- box rim -->
  <path d="M104 112h112" stroke="#C3CEF0" stroke-width="2"/>

  <!-- flag on the box -->
  <rect x="146" y="132" width="4" height="40" rx="2" fill="#F59E0B"/>
  <path d="M150 133h22c3 0 4 3 2 5l-5 6 5 6c2 2 1 5-2 5h-22z" fill="#FBBF24"/>

  <!-- dashed flight trail -->
  <path d="M168 90c-8-10-4-24 8-22 12 2 8 20-4 16-10-4 4-24 30-22 22 2 32 6 50-14" stroke="#9DB0EE" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>

  <!-- paper plane -->
  <path d="M292 34l-52 22 16 6 4 18 8-12 14 8z" fill="url(#plane)"/>
  <path d="M256 62l36-28-28 34z" fill="#4C68D6"/>

  <!-- sparkles -->
  <g fill="#9DB0EE">
    <path d="M62 92l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M232 120l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M88 60l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/>
    <circle cx="246" cy="92" r="2.5"/>
  </g>
  <g fill="#FBBF24">
    <path d="M84 140l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M262 136l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>
</svg>
