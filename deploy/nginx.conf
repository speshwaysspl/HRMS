# Speshway HRMS — production nginx site (/etc/nginx/sites-available/speshwayhrms)
# Serves the built frontend (frontend/dist) and proxies the API + Socket.IO to
# the Node backend on 127.0.0.1:5000. Cloudflare Tunnel points at http://localhost:80.
# Never expose `vite` / `npm run dev` to the internet.

# Keep this CSP in sync with frontend/vite.config.js.
map $host $hrms_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://speshwayhrms.com https://*.speshwayhrms.com wss://speshwayhrms.com wss://*.speshwayhrms.com https://*.googleapis.com https://ipapi.co https://nominatim.openstreetmap.org; worker-src 'self'; frame-src 'self' https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
}

server {
    listen 127.0.0.1:80;
    server_name speshwayhrms.com www.speshwayhrms.com;

    root /var/www/speshwayhrms/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;

    add_header Content-Security-Policy $hrms_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Only serve real files; block dotfiles and stray folders like /_r/.
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /_r/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location = /metrics { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must never be cached, so a fixed deploy replaces it immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $hrms_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
