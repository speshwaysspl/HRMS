<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="speshway">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>speshway</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Hide scrollbars across all browsers */
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    html, body {
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #161B35;
    }
    .web-splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .web-splash-card {
      background: white;
      padding: 18px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .web-splash-title {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div id="loading" class="web-splash-container">
    <div class="web-splash-card">
      <img src="logo.png" width="88" height="88" alt="Speshway HRMS Logo" />
    </div>
    <div class="web-splash-title">SPESHWAY HRMS</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
