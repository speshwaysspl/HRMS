name: speshway
description: "Speshway HRMS — mobile companion to the Speshway HR platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.3
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  pdf: ^3.11.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.4.0
  geolocator: ^13.0.1
  geocoding: ^5.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  quick_actions: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
    - assets/appbar_bg.png
